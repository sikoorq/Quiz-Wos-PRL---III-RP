<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz: od PRL do III RP – wersja spokojna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --comic:"Comic Sans MS","Comic Neue","Chalkboard SE",cursive;
  --ui:Tahoma,Verdana,"Segoe UI",sans-serif;
  --g:#c0c0c0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;font-family:var(--ui);color:#000;
  padding:12px 8px 56px;
  background:linear-gradient(120deg,#ff0080,#ff8c00,#ffe600,#3cff00,#00f0ff,#3d5bff,#b400ff,#ff0080);
  background-size:400% 400%;animation:bg 20s linear infinite;
}
@keyframes bg{0%{background-position:0% 50%}100%{background-position:100% 50%}}
button{color:#000}

/* ---------- WIN95 CHROME ---------- */
.bevel{background:var(--g);border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080,inset 1px 1px #dfdfdf}
.inset{border:2px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px #000}
.win{max-width:860px;margin:0 auto;box-shadow:inset -1px -1px #808080,inset 1px 1px #dfdfdf,7px 7px 0 rgba(0,0,0,.35)}
.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;font-size:13px;padding:3px 3px 3px 6px;display:flex;align-items:center;gap:6px;user-select:none}
.title .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtns{display:flex;gap:2px}
.tbtns button{width:20px;height:18px;padding:0;font:bold 11px/1 var(--ui);background:var(--g);border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080;cursor:pointer}
.tbtns button:active{border-color:#000 #fff #fff #000}
.menu{display:flex;flex-wrap:wrap;gap:1px;font-size:13px;padding:2px 3px}
.menu button{background:none;border:0;padding:3px 8px;font:inherit;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:#000080;color:#fff;outline:none}
.wbody{display:flex;gap:4px;padding:3px 4px 4px}
.tools{flex:none;width:56px;display:grid;grid-template-columns:repeat(2,26px);grid-auto-rows:26px;gap:0;align-content:start;justify-content:center}
.tool{display:grid;place-items:center;font-size:14px;cursor:pointer;padding:0;background:var(--g);border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080}
.tool.on{border-color:#000 #fff #fff #000;box-shadow:inset 1px 1px #808080;background:repeating-conic-gradient(#fff 0 25%,#dcdcdc 0 50%) 0 0/4px 4px}
.toolopt{grid-column:1/-1;height:64px;margin-top:6px}
.canwrap{flex:1;min-width:0;background:#808080;overflow:hidden}
.canvas{
  position:relative;min-height:540px;padding:22px 18px 80px;overflow:hidden;
  background:linear-gradient(160deg,#ff2d95 0%,#ff9a00 17%,#fff200 33%,#4dff4d 50%,#00e1ff 66%,#4b6bff 83%,#c43cff 100%);
  transition:background .4s;
}
.status{display:flex;gap:3px;padding:3px 4px;font-size:12px}
.status span{border:1px solid;border-color:#808080 #fff #fff #808080;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status span:first-child{flex:1}
.pal{display:flex;align-items:center;gap:8px;padding:4px 6px 2px}
.cur{position:relative;width:34px;height:34px;flex:none;background:#fff}
.cur i{position:absolute;width:14px;height:14px;border:1px solid #000}
.cur .fg{left:5px;top:5px;z-index:1}
.cur .bgc{right:5px;bottom:5px;background:#fff}
.sw{display:grid;grid-template-columns:repeat(15,17px);grid-auto-rows:17px;gap:1px}
.sw button{padding:0;cursor:pointer;border:2px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px #000}
.sw .rb{background:conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red)}
.btn95{font:13px var(--ui);min-width:88px;min-height:32px;padding:6px 14px;cursor:pointer;background:var(--g);border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:inset -1px -1px #808080,inset 1px 1px #dfdfdf}
.btn95:active{border-color:#000 #fff #fff #000;box-shadow:inset 1px 1px #808080}
.btn95:focus-visible{outline:1px dotted #000;outline-offset:-6px}

/* ---------- STICKERS / CLIPART ---------- */
.st{position:absolute;pointer-events:none;z-index:0;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.35));line-height:1}
.s-sun{right:10px;top:10px;font-size:58px;animation:spin 14s linear infinite}
.s-cloud{left:8px;top:6px;font-size:46px;animation:float 5s ease-in-out infinite}
.s-cloud2{left:38%;top:2px;font-size:30px;opacity:.9;animation:float 7s ease-in-out infinite reverse}
.s-frog{left:8px;bottom:8px;font-size:62px;animation:hop 2.4s ease-in-out infinite}
.s-cat{right:12px;bottom:12px;font-size:54px;animation:wob 3s ease-in-out infinite}
.s-dog{left:44%;bottom:6px;font-size:34px;animation:wob 2.6s ease-in-out infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(8px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0)}}
@keyframes wob{50%{transform:rotate(8deg)}}

/* ---------- WORDART ---------- */
.wa{font-family:var(--comic);font-weight:900;line-height:1.05;display:inline-block;color:transparent;-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:1.5px #000;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.55))}
.rb{background-image:linear-gradient(90deg,#ff0000,#ff9900,#ffee00,#22cc22,#0099ff,#9933ff,#ff00cc)}
.fire{background-image:linear-gradient(180deg,#fff200 10%,#ff7a00 55%,#d10000 95%)}
.cyan{background-image:linear-gradient(180deg,#bfffff,#00e5ff 45%,#0040ff)}
.lime{background-image:linear-gradient(180deg,#f4ff9e,#7dff00 50%,#008a1e)}
.pink{background-image:linear-gradient(180deg,#ffd6f5,#ff4fd8 50%,#a1007a)}
.wave{display:inline-block;white-space:nowrap}
.wave>span{display:inline-block}
.wave .sp{width:.3em}
.center{text-align:center}

/* ---------- CONTENT ---------- */
.stage{position:relative;z-index:1;max-width:640px;margin:0 auto}
.paper{background:#fffef4;border:3px solid #000;box-shadow:6px 6px 0 #000;padding:18px 16px;margin:14px 0}
.tilt-l{transform:rotate(-.7deg)}
.tilt-r{transform:rotate(.6deg)}
.tag{display:inline-block;background:#fff200;border:2px solid #000;box-shadow:3px 3px 0 #000;padding:3px 10px;font:900 13px var(--comic);text-transform:uppercase;transform:rotate(-3deg);margin-bottom:10px}
.tfl{display:inline-block;margin-left:8px;background:#00e1ff;border:2px solid #000;padding:3px 8px;font:900 12px var(--comic);transform:rotate(2deg)}
.qtext{font:700 21px/1.3 var(--comic);margin:6px 0 4px}
.ans{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:10px 12px;margin:12px 0 0;font:700 16px/1.3 var(--comic);cursor:pointer;transition:transform .08s,box-shadow .08s}
.ans:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000}
.ans:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.ans:focus-visible{outline:3px dashed #ff00a8;outline-offset:3px}
.ans:disabled{cursor:default}
.ans .k{flex:none;width:32px;height:32px;display:grid;place-items:center;border:2px solid #000;font:900 16px var(--comic)}
.ans:nth-child(1) .k{background:#ff5e7e}.ans:nth-child(2) .k{background:#fff200}.ans:nth-child(3) .k{background:#5dff5d}.ans:nth-child(4) .k{background:#4fc3ff}
.ans.ok{background:#8dff7a}
.ans.bad{background:#ff8aa5;animation:shake .4s}
.ans.dim{opacity:.5}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{border:2px solid #000;box-shadow:3px 3px 0 #000;padding:4px 10px;font:900 14px var(--comic);background:#fff}
.chip.c1{background:#fff;transform:rotate(-2deg)}
.chip.c2{background:#fff200;transform:rotate(1.5deg)}
.chip.c3{background:#ff9ff3;transform:rotate(-1deg)}
.chip.hot{animation:pulse .5s}
@keyframes pulse{50%{transform:scale(1.25) rotate(-4deg)}}
.prog{height:22px;background:#fff;padding:2px;display:flex}
.prog i{display:block;height:100%;background:repeating-linear-gradient(90deg,#000080 0 10px,transparent 10px 12px);transition:width .4s}

.dlg{margin-top:16px}
.dlg .in{display:flex;gap:12px;padding:14px 12px 8px;font-size:14px;line-height:1.45;align-items:flex-start}
.dlg .ico{font-size:32px;line-height:1;flex:none}
.dlg .in p{margin:6px 0 0}
.dlg .row{display:flex;justify-content:flex-end;gap:8px;padding:4px 12px 12px;flex-wrap:wrap}
.pop{animation:popin .25s ease-out}
@keyframes popin{from{transform:scale(.85);opacity:0}}

/* menu screen */
.hero{text-align:center;margin:6px 0 4px}
.hero .l1{font-size:30px;transform:rotate(-4deg)}
.hero .l2{font-size:34px;transform:rotate(2deg);margin-top:4px}
.hero .l3{font-size:clamp(44px,10vw,72px);margin-top:10px}
.hero .l4{font-size:clamp(28px,6vw,40px);margin-top:4px}
.sub{display:inline-block;margin-top:14px;background:#fff;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:5px 12px;font:900 15px var(--comic);transform:rotate(-2deg)}
h3.h{font:900 18px var(--comic);margin:4px 0 10px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.mode{border:3px solid #000;box-shadow:4px 4px 0 #000;background:#fff;padding:10px 6px;font:900 15px/1.2 var(--comic);cursor:pointer;transition:transform .1s}
.mode small{display:block;font-weight:700;font-size:12px;margin-top:3px}
.mode.sel{background:#fff200;transform:rotate(-2deg) scale(1.03)}
.cbs{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-bottom:12px}
.cb{display:flex;align-items:center;gap:8px;min-height:34px;font-size:14px;cursor:pointer}
.cb input{appearance:none;-webkit-appearance:none;flex:none;width:16px;height:16px;margin:0;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px #000;display:grid;place-items:center;cursor:pointer}
.cb input:checked::after{content:"✔";font-size:12px;line-height:1;color:#000}
.cb .n{color:#555;font-size:12px}
.go{display:block;margin:16px auto 4px;font:900 28px var(--comic);padding:12px 34px;background:linear-gradient(#a6ff8f,#1fbf1f);border:3px solid #000;box-shadow:5px 5px 0 #000;cursor:pointer;transform:rotate(-2deg);transition:transform .1s}
.go:hover{transform:rotate(-2deg) scale(1.05)}
.go:active{transform:rotate(-2deg) translate(3px,3px);box-shadow:2px 2px 0 #000}
.never{display:inline-block;background:#fff;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:6px 12px;font:900 19px var(--comic);transform:rotate(-4deg);margin-top:18px}
.never span:nth-child(6n+1){color:#e00000}.never span:nth-child(6n+2){color:#ff7a00}.never span:nth-child(6n+3){color:#c9b800}.never span:nth-child(6n+4){color:#00a800}.never span:nth-child(6n+5){color:#0057ff}.never span:nth-child(6n){color:#9d00ff}
.best{font:700 14px var(--comic);text-align:center;margin-top:6px}
.warn{color:#c00;font:700 13px var(--comic);text-align:center;min-height:18px}

/* end screen */
.endwa{font-size:clamp(90px,24vw,150px);transform:rotate(-7deg);-webkit-text-stroke:3px #000}
.score{font:900 26px var(--comic);text-align:center}
.grade{display:block;width:max-content;max-width:100%;margin:12px auto;padding:8px 18px;border:3px solid #000;box-shadow:5px 5px 0 #000;font:900 22px var(--comic);transform:rotate(-2deg);text-align:center}
.g6,.g5{background:#8dff7a}.g4{background:#fff200}.g3{background:#ffbf5e}.g2,.g1{background:#ff8aa5}
.msg{text-align:center;font:700 16px var(--comic);margin:6px 0}
.meta{text-align:center;font:700 14px var(--comic)}
.secrow{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.secrow .prog{height:18px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}
.fun{font:900 16px var(--comic);padding:10px 16px;border:3px solid #000;box-shadow:4px 4px 0 #000;cursor:pointer;background:#fff}
.fun:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.fun.y{background:#fff200}.fun.p{background:#ff9ff3}.fun.c{background:#7ff0ff}
.mist{border-top:2px dashed #000;padding:10px 0;font-size:14px;line-height:1.45}
.mist:first-of-type{border-top:0}
.mist b.q{font:700 16px/1.3 var(--comic);display:block;margin-bottom:4px}
.mist .yr{color:#b00020}.mist .cr{color:#006b16}
.mist .ex{color:#333;margin-top:3px}
.newrec{display:block;width:max-content;margin:8px auto 0;background:#ff00a8;color:#fff;border:3px solid #000;padding:4px 12px;font:900 16px var(--comic);transform:rotate(3deg);animation:pulse 1s infinite}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.25);display:grid;place-items:center;z-index:40;padding:16px}
.ov .dlg{max-width:440px;width:100%;margin:0}
.ov ul{margin:6px 0 0;padding-left:18px}
.ov li{margin:4px 0}
.stamp{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:60}
.stamp span{font-size:clamp(34px,9vw,70px);text-align:center;padding:0 12px;animation:stamp 1s ease forwards}
@keyframes stamp{0%{transform:scale(.2) rotate(-20deg);opacity:0}25%{transform:scale(1.12) rotate(-6deg);opacity:1}70%{transform:scale(1) rotate(-6deg);opacity:1}100%{transform:scale(1.3) rotate(-6deg);opacity:0}}
.cf{position:fixed;width:9px;height:9px;z-index:55;pointer-events:none;border:1px solid #000;animation:cf .95s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),calc(var(--dy) + 90px)) rotate(var(--r));opacity:0}}

/* GIEREK SHOW */
.gk{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden;cursor:pointer;
}
.gk .gkbg{position:absolute;inset:-50%;z-index:0;opacity:.93;animation:gkrot 30s linear infinite}
.gk .gkbg.hue{animation:gkrot 30s linear infinite,gkbg 6s linear infinite}
.gk>*:not(.gkbg){position:relative;z-index:2}
@keyframes gkrot{to{transform:rotate(360deg)}}
@keyframes gkbg{to{filter:hue-rotate(360deg)}}
.gk .cap{font-size:clamp(38px,11vw,84px);text-align:center;z-index:2}
.gk .cap2{font-size:clamp(28px,9vw,76px);text-align:center;z-index:2}
.gk .ring{position:relative;width:min(78vw,340px);height:min(78vw,340px);flex:none}
.gk .disc{position:absolute;inset:10%;border-radius:50%;border:5px solid #000;box-shadow:8px 8px 0 #000;
  background:conic-gradient(#ff0000,#ff9900,#ffee00,#22cc22,#00e5ff,#2f5bff,#b400ff,#ff0000);display:grid;place-items:center;animation:gkspin 1.6s linear infinite}
.gk .disc .in{width:88%;height:88%;border-radius:50%;background:#fffef4;border:4px solid #000;display:grid;place-items:center;text-align:center}
.gk .disc .in{overflow:hidden}
.gk .disc .in img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.gk .name{position:absolute;left:50%;bottom:0;transform:translateX(-50%) rotate(-5deg);white-space:nowrap;background:#fff;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:4px 12px;z-index:3}
.gk .name .wa{font-size:clamp(24px,7vw,38px)}
.gk .orb{position:absolute;inset:0;animation:gkspin 5s linear infinite reverse}
.gk .orb span{position:absolute;left:50%;top:50%;font-size:clamp(30px,9vw,46px);margin:-.5em;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.4))}
.gk .note{background:#fff;border:3px solid #000;box-shadow:4px 4px 0 #000;padding:6px 12px;font:900 15px var(--comic);transform:rotate(-2deg);text-align:center;z-index:2;max-width:92vw}
.gk .close95{z-index:2}
.gk-in{animation:gkpop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes gkpop{from{transform:scale(0) rotate(-180deg)}}
@keyframes gkspin{to{transform:rotate(360deg)}}


/* GALERIA */
.l3g{font-size:clamp(40px,10vw,64px)}
.chip.c0{background:#7ff0ff;cursor:pointer;font-family:var(--comic)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:16px}
.pcard{display:flex;flex-direction:column;gap:10px;background:#fffef4;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:14px;font-family:var(--comic);transform:rotate(var(--r))}
.phead{display:flex;align-items:center;gap:12px}
.pcard .av{flex:none;display:block;width:92px;height:92px;border-radius:50%;border:3px solid #000;padding:5px;cursor:pointer;background:conic-gradient(#ff0000,#ff9900,#ffee00,#22cc22,#00e5ff,#2f5bff,#b400ff,#ff0000)}
.pcard .av:hover{animation:gkspin 1.2s linear infinite}
.pcard .av:focus-visible{outline:3px dashed #ff00a8;outline-offset:3px}
.pcard .av .in{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#fff;overflow:hidden;border:2px solid #000}
.pcard .av img{width:100%;height:100%;object-fit:cover}
.pcard .av .mono .wa{font-size:28px;-webkit-text-stroke:1px #000}
.pcard .av .sym{font-size:16px}
.pmeta{display:flex;flex-direction:column;gap:2px;min-width:0}
.pmeta b{font-size:18px;line-height:1.15}
.pmeta small{font-size:12.5px;color:#333;font-weight:700}
.pmeta .yrs{color:#b4007a}
.facts{list-style:none;margin:0;padding:0;font:700 13.5px/1.4 var(--comic);border-top:2px dashed #000;padding-top:6px}
.facts li{position:relative;padding-left:22px;margin:7px 0}
.facts li::before{content:"★";position:absolute;left:0;top:-1px;font-size:16px;-webkit-text-stroke:.5px #000}
.facts li:nth-child(5n+1)::before{color:#ff2d55}.facts li:nth-child(5n+2)::before{color:#ff9900}.facts li:nth-child(5n+3)::before{color:#ffe600}.facts li:nth-child(5n+4)::before{color:#22cc22}.facts li:nth-child(5n)::before{color:#2f9bff}
.facts b{background:#fff200;padding:0 3px;border:1px solid #000}
.pcred{margin:-2px 0 0;font:600 10.5px/1.35 var(--comic);color:#555}
.pcred a{color:inherit}
.psrc{margin:18px 4px 4px;font:600 12px/1.45 var(--comic);color:#333;text-align:center}
.psrc a{color:inherit}
.pcard .av img{object-position:50% 20%}
.pcard .spin{align-self:center;font-size:15px;padding:8px 16px}
.mono{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.gk .mono .wa{font-size:clamp(56px,17vw,96px);-webkit-text-stroke:2px #000}
.gk .mono .sym{font-size:clamp(30px,9vw,48px);margin-top:4px}

/* ============ WERSJA SPOKOJNA ============ */
body.calm{--comic:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#f5f3ee;animation:none;color:#1d1d1b;padding:28px 14px 40px}
.calm .win{background:transparent;border:0;box-shadow:none;max-width:680px}
.calm .title,.calm .menu,.calm .tools,.calm .pal,.calm .status,.calm .task,.calm .smenu,.calm .st,.calm .never,.calm .hero .l1,.calm .hero .l2{display:none!important}
.calm .wbody{padding:0}
.calm .canwrap{background:none;border:0;box-shadow:none;overflow:visible}
.calm .canvas{background:none!important;padding:0 0 30px;min-height:0;overflow:visible}
.calm .wa{color:#1d1d1b;background:none!important;-webkit-text-stroke:0!important;filter:none;font-weight:800;letter-spacing:-.02em}
.calm .wave>span{transform:none!important}
.calm .wave .sp{width:.28em}
.calm .hero{text-align:left;margin:0 0 6px}
.calm .hero .l3,.calm .l3g{font-size:40px;margin:0}
.calm .hero .l4{font-size:22px;margin-top:4px}
.calm .hero .l4 .wa{color:#8a867c;font-weight:600}
.calm .sub{background:none;border:0;box-shadow:none;transform:none;padding:0;margin-top:10px;font-weight:500;font-size:14px;color:#6b675e}
.calm .paper{background:#fff;border:1px solid #e6e2d9;box-shadow:0 1px 2px rgba(0,0,0,.04);border-radius:16px;transform:none;padding:22px 20px}
.calm h3.h{font-size:15px;font-weight:600}
.calm .mode{border:1px solid #e0dcd2;box-shadow:none;border-radius:12px;transform:none;font-weight:600;background:#fff;transition:background .15s}

}

{s:0,t:true,q:"Poznański Czerwiec był pierwszym tak dużym strajkiem generalnym i demonstracją uliczną robotników w PRL.",e:"Prawda – to pierwszy tak duży strajk generalny i demonstracje robotników w PRL."},

{s:0,q:"Co wywołało protesty robotnicze na Wybrzeżu w grudniu 1970 r.?",a:["Drastyczne podwyżki cen żywności przed świętami","Wprowadzenie stanu wojennego","Delegalizacja „Solidarności”","Wybór Polaka na papieża"],e:"Bezpośrednią przyczyną były drastyczne podwyżki cen żywności tuż przed świętami."},
{s:0,q:"Jaki był bilans ofiar Grudnia 1970?",a:["ok. 45 zabitych i ok. 1,2 tys. rannych","58 zabitych","ok. 100 zabitych i 10 tys. internowanych","Nikt nie zginął"],e:"Władze ponownie użyły wojska – zginęło ok. 45 osób, a ok. 1,2 tys. zostało rannych."},

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=a=>a[Math.floor(Math.random()*a.length)];

function wave(text,cls,amp=7){
  const ch=[...text],n=ch.length;
  return `<span class="wave">`+ch.map((c,i)=>c===" "?`<span class="sp"> </span>`:
   `<span class="wa ${cls}" style="background-size:${n*100}% 100%;background-position:${n>1?i/(n-1)*100:0}% 0;transform:translateY(${(Math.sin(i*.7)*amp).toFixed(1)}px) rotate(${(Math.sin(i*.7+1.2)*5).toFixed(1)}deg)">${c}</span>`).join("")+`</span>`;
}
const rainbowText=t=>[...t].map(c=>`<span>${c}</span>`).join("");
function status(msg,pos,pts){if(msg!=null)$("#stMsg").textContent=msg;if(pos!=null)$("#stPos").textContent=pos;if(pts!=null)$("#stPts").textContent="⭐ "+pts}

/* ================= DŹWIĘK ================= */
let actx=null;
function tone(f,d,type="sine",delay=0,vol=.15){
  if(!st.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+delay;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d)}catch(e){}
}
const sGood=()=>{tone(880,.15);tone(1320,.25,"sine",.1)};
const sBad=()=>{tone(180,.3,"square",0,.08);tone(140,.35,"square",.12,.08)};
const sTada=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.35,"triangle",i*.12))};
function toggleSound(){st.sound=!st.sound;$("#snd").textContent=st.sound?"🔊":"🔇";status("Dźwięk: "+(st.sound?"włączony":"wyłączony"));if(st.sound)tone(660,.12)}

/* ================= EFEKTY ================= */
const isCalm=()=>document.body.classList.contains("calm");
function confetti(x,y,n=30){
  if(isCalm())return;
  for(let i=0;i<n;i++){const s=document.createElement("i");s.className="cf";
    s.style.left=x+"px";s.style.top=y+"px";s.style.background=COLS[i%COLS.length];
    const a=Math.random()*Math.PI*2,d=60+Math.random()*140;
    s.style.setProperty("--dx",(Math.cos(a)*d).toFixed(0)+"px");s.style.setProperty("--dy",(Math.sin(a)*d-50).toFixed(0)+"px");s.style.setProperty("--r",(Math.random()*720-360).toFixed(0)+"deg");
    document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}
}
function stampFx(txt,cls){if(isCalm())return;const d=document.createElement("div");d.className="stamp";d.innerHTML=`<span class="wa ${cls}">${txt}</span>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}

  <div class="in"><div class="ico">${icon}</div><div>${html}</div></div><div class="row"><button class="btn95" data-close>${btn}</button></div></div>`;
  o.addEventListener("click",e=>{if(e.target===o||e.target.hasAttribute("data-close"))closeModal()});
  document.body.appendChild(o);o.querySelector(".row .btn95").focus();
}

function pickQuestions(){
  const p=st.lastPick||st;const pool=Q.filter(q=>p.secs.has(q.s));
  const n=p.mode==="all"?pool.length:Math.min(p.mode,pool.length);
  let out=shuffle(pool).slice(0,n);if(!p.random)out.sort((a,b)=>a.id-b.id);return out;
}

/* ================= QUIZ ================= */
function startQuiz(items){
  st.list=items.map(src=>{let opts=src.a.map((t,k)=>({text:t,ok:k===src.c}));if(!src.tf)opts=shuffle(opts);return{src,opts}});
  st.i=0;st.score=0;st.streak=0;st.bestStreak=0;st.log=[];
  renderQ();$("#win").scrollIntoView({behavior:"smooth",block:"start"});
}
function renderQ(){
  st.answered=false;
  const it=st.list[st.i],q=it.src,n=st.list.length;
  stage.innerHTML=`
  <div class="hud">
    <button class="chip c0" id="toMenu">✕</button>
    <span class="chip c1">Pytanie ${st.i+1}/${n}</span>
    <span class="chip c2">⭐ ${st.score} pkt</span>
    <span class="chip c3" id="stk">🔥 seria: ${st.streak}</span>
  </div>
  <div class="prog inset"><i style="width:${st.i/n*100}%"></i></div>
  <div class="paper ${st.i%2?"tilt-r":"tilt-l"}">
    <span class="tag">${SECTIONS[q.s].short}</span>${q.tf?`<span class="tfl">PRAWDA CZY FAŁSZ?</span>`:""}
    <h2 class="qtext">${q.q}</h2>
    <div class="answers">${it.opts.map((o,k)=>`<button class="ans" data-k="${k}"><span class="k">${q.tf?(o.text==="Prawda"?"P":"F"):"ABCD"[k]}</span><span>${o.text}</span></button>`).join("")}</div>
  </div>
  <div id="fb"></div>`;
  stage.querySelectorAll(".ans").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $("#toMenu").onclick=renderMenu;$("#toMenu").title="Wróć do menu";$("#toMenu").setAttribute("aria-label","Wróć do menu");
  status(SECTIONS[q.s].name,`Pyt. ${st.i+1}/${n}`,st.score);
}
function answer(k){
  if(st.answered)return;st.answered=true;
  const it=st.list[st.i],q=it.src,opt=it.opts[k],ok=opt.ok,corr=it.opts.find(o=>o.ok).text;
  const btns=[...stage.querySelectorAll(".ans")];
  btns.forEach((b,j)=>{b.disabled=true;if(it.opts[j].ok)b.classList.add("ok");else if(j===k)b.classList.add("bad");else b.classList.add("dim")});
  st.log.push({src:q,chosen:opt.text,correct:corr,ok});
  if(ok){st.score++;st.streak++;st.bestStreak=Math.max(st.bestStreak,st.streak);sGood();
    const r=btns[k].getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2);
    stampFx(st.streak>=3&&st.streak%3===0?`SERIA x${st.streak} 🔥`:rnd(["HISTORY IS MY PASSION","BRAWO!","MORE POINTS!","EVEN MORE PASSION","SUPER!","MISTRZ!"]),rnd(["rb","fire","lime","cyan","pink"]));
  }else{st.streak=0;sBad();stampFx(rnd(["UPS...","NIE TYM RAZEM","OJ, NIE!"]),"pink")}
  const stk=$("#stk");stk.textContent="🔥 seria: "+st.streak;if(ok)stk.classList.add("hot");
  stage.querySelector(".chip.c2").textContent=`⭐ ${st.score} pkt`;
  stage.querySelector(".prog i").style.width=((st.i+1)/st.list.length*100)+"%";
  const last=st.i===st.list.length-1;
  $("#fb").innerHTML=`<div class="dlg bevel pop">
    <div class="title"><span class="tt">${ok?"Paint – Sukces":"Paint – Błąd"}</span><span class="tbtns"><button tabindex="-1" aria-hidden="true">×</button></span></div>
    <div class="in"><div class="ico">${ok?"✅":"❌"}</div><div><b>${ok?rnd(["Dobrze!","Zgadza się!","Brawo, dokładnie tak!","Świetnie!"]):"Poprawna odpowiedź: "+corr}</b><p>${q.e}</p></div></div>
    <div class="row"><button class="btn95" id="next">${last?"Zobacz wynik ▶":"Dalej ▶"}</button></div></div>`;
  $("#next").onclick=next;
  setTimeout(()=>{const n=$("#next");if(n){n.focus({preventScroll:true});$("#fb").scrollIntoView({behavior:"smooth",block:"nearest"})}},60);
  status(ok?"Dobra odpowiedź! +1 pkt":"Zła odpowiedź – przeczytaj wyjaśnienie.",null,st.score);
}
function next(){if(!st.answered)return;if(st.i<st.list.length-1){st.i++;renderQ();$("#win").scrollIntoView({behavior:"smooth",block:"start"})}else renderEnd()}

/* ================= KONIEC ================= */
function grade(p){if(p>=95)return[6,"celujący","Celująco! Możesz prowadzić lekcję zamiast nauczyciela 😎"];if(p>=85)return[5,"bardzo dobry","Bardzo dobrze! Jeszcze kilka szczegółów i będzie szóstka."];if(p>=70)return[4,"dobry","Dobrze! Przejrzyj błędy poniżej i spróbuj jeszcze raz."];if(p>=50)return[3,"dostateczny","Nieźle, ale warto powtórzyć działy z najsłabszym wynikiem."];if(p>=30)return[2,"dopuszczający","Jest podstawa – przeczytaj wyjaśnienia błędów i popraw je."];return[1,"niedostateczny","Ups… Notatka czeka. Przeczytaj wyjaśnienia i spróbuj ponownie!"]}
function renderEnd(){
  const n=st.list.length,pct=Math.round(st.score/n*100),[g,gn,msg]=grade(pct);
  let rec=false;if(pct>best){best=pct;rec=true;try{localStorage.setItem("quizprl_best",pct)}catch(e){}}
  const per=SECTIONS.map((s,i)=>{const l=st.log.filter(x=>x.src.s===i);return{s,tot:l.length,ok:l.filter(x=>x.ok).length}}).filter(x=>x.tot);
  const wrong=st.log.filter(x=>!x.ok);
  stage.innerHTML=`
  <div class="center"><span class="wa fire endwa">END</span></div>
  <div class="paper tilt-r">
    <div class="score">Wynik: ${st.score}/${n} (${pct}%)</div>
    <span class="grade g${g}">Ocena: ${g} – ${gn}</span>
    ${rec&&n>=10?`<span class="newrec">NOWY REKORD!</span>`:""}
    <p class="msg">${msg}</p>
    <div class="meta">🔥 Najdłuższa seria: ${st.bestStreak} • 🏆 Rekord: ${best}%</div>
    <h3 class="h" style="margin-top:16px">📊 Wyniki w działach</h3>
    ${per.map(x=>`<div class="secrow"><span>${x.s.name}</span><div class="prog inset"><i style="width:${x.ok/x.tot*100}%"></i></div><b>${x.ok}/${x.tot}</b></div>`).join("")}
  </div>
  <div class="btnrow">
    <button class="fun y" id="again">🔁 Jeszcze raz</button>
    ${wrong.length?`<button class="fun p" id="fix">❌ Popraw błędy (${wrong.length})</button>`:""}
    <button class="fun c" id="home">🏠 Menu</button>
  </div>
  <div class="paper tilt-l">
    <h3 class="h">${wrong.length?`📝 Twoje błędy (${wrong.length})`:"🏆 Zero błędów!"}</h3>
    ${wrong.length?wrong.map(x=>`<div class="mist"><b class="q">${x.src.q}</b><div class="yr">❌ Twoja odpowiedź: ${x.chosen}</div><div class="cr">✅ Poprawna: ${x.correct}</div><div class="ex">💡 ${x.src.e}</div></div>`).join(""):`<p class="msg">${wave("HISTORY IS YOUR PASSION","rb",4)}</p>`}
  </div>`;
  $("#again").onclick=()=>startQuiz(pickQuestions());
  if(wrong.length)$("#fix").onclick=()=>startQuiz(shuffle(wrong.map(x=>x.src)));
  $("#home").onclick=renderMenu;
  status(`Koniec! Ocena: ${g} (${gn}).`,"Wynik",st.score);
  $("#win").scrollIntoView({behavior:"smooth",block:"start"});
  sTada();
  if(pct>=70){const r=stage.querySelector(".endwa").getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,60)}
}

   noteHtml:"Donald Tusk • premier 2007–2014 i ponownie od grudnia 2023<br><small>Przewodniczący Rady Europejskiej 2014–2019</small>",status:"Plik → tryb Für Deutschland uruchomiony 🇩🇪"})
};
const discInner=c=>c.img?`<img src="${c.img}" alt="${c.alt}" loading="lazy" decoding="async">`:`<div class="mono"><span class="wa rb">${c.mono}</span><span class="sym">${c.sym}</span></div>`;
function showShow(c){
  if(typeof c==="string")c=EGGS[c]||person(c);
  closeGierek();
  const emo=[];while(emo.length<8)emo.push(...c.emo);emo.length=8;
  const g=document.createElement("div");g.className="gk";g.id="gk";g.setAttribute("role","dialog");g.setAttribute("aria-label",c.name);
  g.innerHTML=`<div class="gkbg${c.nohue?"":" hue"}" style="background:${c.bg||RB_BG}"></div>
    <div class="cap gk-in">${wave(c.top[0],c.top[1],8)}</div>
    <div class="ring gk-in">
      <div class="orb">${emo.map((e,i)=>{const a=i/8*Math.PI*2;return `<span style="left:${(50+Math.cos(a)*45).toFixed(1)}%;top:${(50+Math.sin(a)*45).toFixed(1)}%">${e}</span>`}).join("")}</div>
      <div class="disc"${c.disc?` style="background:${c.disc}"`:""}><div class="in">${discInner(c)}</div></div>
      <div class="name"><span class="wa rb">${c.name}</span></div>
    </div>
    <div class="cap2 gk-in">${wave(c.bottom[0],c.bottom[1],8)}</div>
    <div class="note">${c.noteHtml||`${c.role} • ${c.years}<br><small>${c.note}</small>`}</div>
    <button class="btn95 close95">Zamknij (Esc)</button>`;
  g.addEventListener("click",closeGierek);
  document.body.appendChild(g);
  sTada();setTimeout(()=>confetti(innerWidth/2,innerHeight/2,70),250);
  status(c.status||(c.name+" – kliknij lub Esc, aby zamknąć"));
}
function renderGallery(){
  closeModal();closeGierek();st.answered=false;
  stage.innerHTML=`
  <div class="hud"><button class="chip c0" id="toMenu">← Menu</button></div>
  <div class="hero"><div class="l3g">${wave("GALERIA","fire",7)}</div><div class="l4">${wave("POSTACI","cyan",5)}</div>
  <div class="sub">${isCalm()?"Najważniejsze fakty i wydarzenia":"Najważniejsze fakty • kliknij „Zakręć!” 🌀"}</div></div>
  <div class="pgrid">${PEOPLE.map((c,i)=>{const nm=c.name.toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase()).replace(/\bIi\b/g,"II");return `<article class="pcard" style="--r:${(i%3-1)*0.8}deg">
    <div class="phead"><button class="av" data-id="${c.id}" aria-label="Zakręć: ${nm}"><span class="in">${discInner(c)}</span></button>
    <div class="pmeta"><b>${nm}</b><small>${c.role}</small><small class="yrs">${c.years}</small></div></div>
    <ul class="facts">${c.facts.map(f=>`<li>${f}</li>`).join("")}</ul>
    ${c.photo?`<p class="pcred">Fot.: <a href="${c.photo.url}" target="_blank" rel="noopener">${c.photo.by}</a> • ${c.photo.licUrl?`<a href="${c.photo.licUrl}" target="_blank" rel="noopener">${c.photo.lic}</a>`:c.photo.lic} • Wikimedia Commons</p>`:""}
    <button class="spin fun y" data-id="${c.id}">🌀 Zakręć!</button></article>`}).join("")}</div>
  <p class="psrc">Zdjęcia pochodzą z <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a> (domena publiczna, wolne licencje Creative Commons/GFDL oraz materiały Parlamentu Europejskiego i kancelarii Prezydenta i Premiera RP). Autor i licencja są podane pod każdą kartą.</p>`;
  stage.querySelectorAll(".pcard [data-id]").forEach(b=>b.onclick=()=>showShow(b.dataset.id));
  $("#toMenu").onclick=renderMenu;
  status("Galeria postaci – kliknij kartę.","Galeria",null);
  $("#win").scrollIntoView({behavior:"smooth",block:"start"});
}
function closeGierek(){const g=$("#gk");if(g)g.remove()}
function act(a){
  $("#smenu").classList.remove("open");
  if(a==="file")showShow("tusk");
  else if(a==="gallery")renderGallery();
  else if(a==="home")renderMenu();
  else if(a==="help")showHelp();
  else if(a==="opts")showShow("gierek");
  else if(a==="sound")toggleSound();
  else if(a==="restart"){if(st.lastPick)startQuiz(pickQuestions());else renderMenu()}
}
document.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();act(b.dataset.act)}));
document.querySelectorAll("[data-err]").forEach(b=>b.addEventListener("click",()=>{sBad();modal("Paint","⛔",`<b>Błąd!</b><p>${rnd(ERRS)}</p>`)}));
$("#xBtn").onclick=()=>renderMenu();
$("#snd").onclick=e=>{e.stopPropagation();toggleSound()};
$("#startBtn").onclick=e=>{e.stopPropagation();$("#smenu").classList.toggle("open")};
document.addEventListener("click",e=>{if(!e.target.closest("#smenu"))$("#smenu").classList.remove("open")});
function clock(){const d=new Date();$("#clock").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
clock();setInterval(clock,15000);

/* ================= KLAWIATURA ================= */
document.addEventListener("keydown",e=>{
  if($("#gk")){if(e.key==="Escape"||e.key==="Enter"){e.preventDefault();closeGierek()}return}
  if($("#ov")){if(e.key==="Escape"||e.key==="Enter"){e.preventDefault();closeModal()}return}
  if(e.key==="Escape"){$("#smenu").classList.remove("open");return}
  const ans=stage.querySelectorAll(".ans");if(!ans.length)return;
  if(st.answered){if(e.key==="Enter"||e.key===" "){e.preventDefault();next()}return}
  const it=st.list[st.i];const key=e.key.toLowerCase();let k=-1;
  if(it.src.tf){if(key==="p"||key==="1")k=0;else if(key==="f"||key==="2")k=1}
  else{k="1234".indexOf(key);if(k<0)k="abcd".indexOf(key)}
  if(k>=0&&k<ans.length){e.preventDefault();answer(k)}
});

renderMenu();
</script>
